<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARK 客服知识库</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="ARK 项目客服快速搜索工具">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.15);
            --accent-hover: #00e5ff;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; z-index: 0;
        }
        .bg-glow {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }
        .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 50px; }
        .logo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 0 30px var(--accent-glow);
        }
        h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #fff 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-top: 8px; }
        .quicklinks {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
            margin: 0 0 30px;
        }
        .quicklink-card {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 18px;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border: 1px solid var(--border); border-radius: 14px;
            color: var(--text-primary); text-decoration: none;
            transition: all 0.25s ease; position: relative; overflow: hidden;
            flex: 1 1 320px; max-width: 420px;
        }
        .quicklink-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: var(--accent); transform: scaleY(0); transform-origin: top;
            transition: transform 0.25s ease;
        }
        .quicklink-card:hover {
            border-color: var(--accent); transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.15);
        }
        .quicklink-card:hover::before { transform: scaleY(1); }
        .quicklink-card:hover .quicklink-arrow { transform: translateX(4px); color: var(--accent); }
        .quicklink-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(0, 212, 255, 0.12); display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; flex-shrink: 0;
        }
        .quicklink-text { flex: 1; min-width: 0; }
        .quicklink-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
        .quicklink-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .quicklink-arrow { color: var(--text-muted); font-size: 1.1rem; transition: all 0.25s ease; flex-shrink: 0; }
        @media (max-width: 480px) {
            .quicklink-card { flex: 1 1 100%; max-width: none; }
        }
        .tag-loading { color: var(--text-muted); font-size: 0.875rem; padding: 10px 0; }

        /* 智能搜索 (AI) */
        .smart-search-container { position: relative; margin-bottom: 16px; }
        .smart-search-container .search-box {
            border-color: rgba(139, 92, 246, 0.25);
            background: linear-gradient(135deg, var(--bg-secondary) 0%, rgba(139, 92, 246, 0.06) 100%);
            padding-left: 54px;
            padding-right: 60px;
        }
        .smart-search-container .search-box:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.18);
        }
        .smart-search-icon {
            position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
            font-size: 1.15rem; pointer-events: none;
        }
        .smart-mode-tag {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            color: #fff; font-size: 0.7rem; font-weight: 700;
            padding: 4px 10px; border-radius: 6px; pointer-events: none;
            letter-spacing: 0.5px;
        }
        .smart-search-hint {
            font-size: 0.75rem; color: var(--text-muted); text-align: center; margin: -8px 0 20px;
        }
        .smart-results { display: none; margin-bottom: 30px; }
        .smart-results.show { display: block; }
        .smart-section-title {
            font-size: 0.85rem; color: var(--text-secondary); margin: 4px 0 10px;
            font-weight: 600; display: flex; align-items: center; gap: 8px;
        }
        .smart-kb-hits {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 12px; padding: 16px; margin-bottom: 16px;
        }
        .smart-kb-item {
            padding: 12px 0; border-bottom: 1px solid var(--border);
        }
        .smart-kb-item:last-child { border-bottom: none; }
        .smart-kb-title {
            font-size: 0.85rem; color: var(--accent); margin-bottom: 6px; font-weight: 500;
        }
        .smart-kb-body {
            font-size: 0.88rem; color: var(--text-primary); line-height: 1.6;
            white-space: pre-wrap;
        }
        .smart-ai-box {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.12) 0%, rgba(0, 212, 255, 0.05) 100%);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 12px; padding: 18px;
        }
        .smart-ai-content {
            font-size: 0.95rem; line-height: 1.7; color: var(--text-primary);
            white-space: pre-wrap; margin-bottom: 12px;
        }
        .smart-ai-warn {
            font-size: 0.75rem; color: #fbbf24; padding-top: 10px;
            border-top: 1px solid rgba(251, 191, 36, 0.2);
            display: flex; align-items: center; gap: 6px;
        }
        .smart-no-kb {
            background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444; padding: 12px 16px; border-radius: 8px;
            font-size: 0.85rem; margin-bottom: 16px;
        }
        .smart-loading {
            padding: 30px 20px; text-align: center; color: var(--text-muted);
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 12px; font-size: 0.9rem;
        }
        .smart-error {
            background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444; padding: 12px 16px; border-radius: 8px;
            font-size: 0.85rem; line-height: 1.6;
        }
        .smart-error-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 6px; }

        .search-container { position: relative; margin-bottom: 24px; }
        .search-box { width: 100%; padding: 18px 24px; padding-left: 54px; font-size: 1rem; font-family: inherit; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; color: var(--text-primary); outline: none; transition: all 0.3s ease; }
        .search-box::placeholder { color: var(--text-muted); }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .shortcuts { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
        .key-hint { background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-muted); border: 1px solid var(--border); }
        .tags-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .tag-btn { padding: 10px 18px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-secondary); font-size: 0.875rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .tag-btn:hover { background: var(--bg-tertiary); border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
        .tag-btn.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); font-weight: 600; }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 12px 16px; background: var(--bg-secondary); border-radius: 10px; border: 1px solid var(--border); font-size: 0.85rem; color: var(--text-secondary); }
        .stats-bar .load-time { color: var(--accent); font-family: 'JetBrains Mono', monospace; }
        .results-count { color: var(--text-muted); }
        .result-item { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 24px; transition: all 0.3s ease; animation: fadeInUp 0.4s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .result-item:hover { border-color: rgba(0, 212, 255, 0.3); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
        /* 最新动态分类：公告 + 嵌套 Q&A */
        .latest-announcement-wrapper { margin-bottom: 16px; }
        .latest-announcement-wrapper .result-item { border-left: 3px solid var(--accent); }
        .latest-qa-title { color: var(--text-secondary); font-size: 0.95rem; font-weight: 600; margin: 24px 0 12px 4px; padding-left: 8px; border-left: 2px solid rgba(0, 212, 255, 0.3); }
        .latest-qa-title .latest-qa-count { font-size: 0.75rem; color: var(--text-muted); font-weight: normal; margin-left: 6px; }
        .latest-qa-list .result-item { border-left: 2px solid rgba(255, 255, 255, 0.1); margin-left: 16px; padding: 18px 20px; }
        .latest-qa-list .result-item:hover { border-left-color: var(--accent); }
        .result-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .result-meta { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { padding: 4px 10px; background: var(--bg-tertiary); border-radius: 6px; font-size: 0.75rem; color: var(--accent); border: 1px solid rgba(0, 212, 255, 0.2); }
        .source-file { font-size: 0.75rem; color: var(--text-muted); padding: 4px 10px; background: var(--bg-tertiary); border-radius: 6px; }
        .result-answer { font-size: 0.95rem; line-height: 1.7; color: var(--text-primary); margin-bottom: 12px; white-space: pre-wrap; }
        .result-answer a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
        .result-answer a:hover { color: var(--accent-hover); text-decoration: underline; }
        .result-answer .contract-address { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 212, 255, 0.1); padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--accent); word-break: break-all; }
        .result-answer .contract-address a { color: var(--accent); font-size: 0.8rem; }
        .result-answer .contract-address .copy-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; font-size: 0.8rem; transition: color 0.2s; }
        .result-answer .contract-address .copy-btn:hover { color: var(--accent); }
        .result-answer mark { background: #fde047; color: #1e293b; font-weight: 700; border-radius: 2px; padding: 0 2px; }
        .result-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .keywords { display: flex; flex-wrap: wrap; gap: 6px; }
        .keyword-tag { padding: 4px 10px; background: var(--bg-tertiary); border-radius: 6px; font-size: 0.75rem; color: var(--text-secondary); }
        .action-btns { display: flex; gap: 8px; }
        .action-btn { padding: 8px 14px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .action-btn:hover { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }
        .action-btn.copy-success { background: var(--success); color: white; border-color: var(--success); }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.5; }
        .empty-title { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 8px; }
        .empty-hint { color: var(--text-muted); font-size: 0.9rem; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-tertiary); border: 1px solid var(--border); padding: 12px 24px; border-radius: 10px; color: var(--text-primary); font-size: 0.9rem; z-index: 1000; transition: transform 0.3s ease; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        @media (max-width: 640px) { .container { padding: 20px 16px; } h1 { font-size: 1.5rem; } .search-box { padding: 14px 16px; padding-left: 44px; font-size: 1rem; } .shortcuts { display: none; } .tags-bar { gap: 8px; } .tag-btn { padding: 8px 14px; font-size: 0.8rem; } .result-item { padding: 18px; } .result-footer { flex-direction: column; align-items: flex-start; } .action-btns { width: 100%; } .action-btn { flex: 1; justify-content: center; } }
        ::selection { background: var(--accent); color: var(--bg-primary); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* 登录遮罩 */
        .login-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-primary);
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            display: flex; align-items: center; justify-content: center;
        }
        .login-overlay.hidden { display: none; }
        .login-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px; padding: 48px 40px;
            max-width: 420px; width: 100%; margin: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .login-icon { font-size: 3rem; text-align: center; margin-bottom: 12px; }
        .login-box h1 {
            text-align: center; font-size: 1.5rem; font-weight: 700;
            margin: 0 0 8px; color: var(--text-primary);
        }
        .login-sub { text-align: center; color: var(--text-muted); font-size: 0.875rem; margin: 0 0 28px; }
        .login-box input {
            width: 100%; padding: 14px 16px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: 12px;
            color: var(--text-primary); font-size: 1rem; box-sizing: border-box;
            outline: none; transition: all 0.2s; margin-bottom: 14px;
            font-family: inherit;
        }
        .login-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
        .login-box button {
            width: 100%; padding: 14px; background: var(--accent); color: var(--bg-primary);
            border: none; border-radius: 12px; font-size: 1rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
        }
        .login-box button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .login-error { color: #ef4444; font-size: 0.875rem; text-align: center; margin-top: 12px; display: none; }
        .login-error.show { display: block; }
        .login-hint { text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 20px; }

        /* 侧边栏 */
        .sidebar {
            position: fixed; top: 0; left: 0; width: 240px; height: 100vh;
            background: var(--bg-secondary); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; z-index: 100;
            transform: translateX(-100%); transition: transform 0.3s ease;
            overflow: hidden;
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 18px 14px; border-bottom: 1px solid var(--border);
            font-size: 1rem; font-weight: 600; color: var(--text-primary);
        }
        .sidebar-close {
            background: none; border: none; color: var(--text-muted);
            font-size: 1.2rem; cursor: pointer; padding: 4px 8px; border-radius: 6px;
        }
        .sidebar-close:hover { color: var(--accent); background: var(--bg-tertiary); }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 8px; }
        .sidebar-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; margin-bottom: 4px; border-radius: 8px;
            color: var(--text-secondary); font-size: 0.9rem; cursor: pointer;
            transition: all 0.2s ease; border: 1px solid transparent;
            user-select: none;
        }
        .sidebar-item:hover { background: var(--bg-tertiary); color: var(--accent); }
        .sidebar-item.active {
            background: var(--accent-glow); color: var(--accent);
            border-color: rgba(0, 212, 255, 0.3); font-weight: 600;
        }
        .sidebar-item .item-icon { font-size: 1.1rem; min-width: 22px; text-align: center; }
        .sidebar-item .item-label { flex: 1; }
        .sidebar-item .item-count {
            font-size: 0.7rem; color: var(--text-muted);
            background: var(--bg-tertiary); padding: 2px 8px; border-radius: 10px;
        }
        .sidebar-item.active .item-count { background: rgba(0, 212, 255, 0.2); color: var(--accent); }
        .sidebar-footer { padding: 12px 18px; border-top: 1px solid var(--border); }
        .logout-btn {
            width: 100%; padding: 10px 12px; background: transparent;
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-muted); cursor: pointer; font-size: 0.85rem;
            margin-bottom: 12px; transition: all 0.2s; font-family: inherit;
        }
        .logout-btn:hover { border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.08); }
        .sidebar-tip { color: var(--text-muted); font-size: 0.75rem; text-align: center; }

        /* 侧边栏开关（汉堡菜单） */
        .sidebar-handle {
            position: fixed; top: 20px; left: 20px; z-index: 99;
            width: 40px; height: 40px; border-radius: 10px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            color: var(--text-primary); font-size: 1.2rem; cursor: pointer;
            display: none; align-items: center; justify-content: center;
            transition: all 0.2s ease;
        }
        .sidebar-handle:hover { border-color: var(--accent); color: var(--accent); }
        .sidebar-backdrop {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
            z-index: 99; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .sidebar-backdrop.show { opacity: 1; pointer-events: auto; }

        /* 主内容偏移 */
        .container { transition: margin-left 0.3s ease; }
        .sidebar-open .container { margin-left: 240px; }

        /* 收藏按钮 */
        .fav-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 1.1rem; cursor: pointer; padding: 2px 6px; border-radius: 4px;
            transition: all 0.2s ease;
        }
        .fav-btn:hover { color: #fbbf24; transform: scale(1.15); }
        .fav-btn.active { color: #fbbf24; }
        .result-header-right { display: flex; align-items: center; gap: 10px; }

        /* 答案图片 */
        .result-image {
            display: block; max-width: 100%; max-height: 400px;
            margin: 0 0 14px; border-radius: 8px; border: 1px solid var(--border);
            cursor: zoom-in; object-fit: contain; background: var(--bg-primary);
        }
        .image-modal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9);
            z-index: 1001; display: none; align-items: center; justify-content: center;
            cursor: zoom-out; padding: 20px;
        }
        .image-modal.show { display: flex; }
        .image-modal img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* 响应式：移动端 */
        @media (max-width: 768px) {
            .sidebar-handle { display: flex; }
            .container { margin-left: 0 !important; }
            .sidebar { width: 280px; }
        }
        @media (min-width: 769px) {
            .sidebar { transform: translateX(0); }
            .sidebar-close { display: none; }
            .sidebar-handle { display: none; }
            .container { margin-left: 240px; max-width: calc(100% - 280px); }
        }
    </style>
</head>
<body>
    <div id="loginOverlay" class="login-overlay">
        <form class="login-box" id="loginForm">
            <div class="login-icon">🔐</div>
            <h1>ARK 客服知识库</h1>

    <script>
        // ============ 密码保护 ============
        // 修改下面这行换成你的密码（部署前在本地编辑器改这个文件，然后 commit + push）
        const KB_PASSWORD = 'ark2026';
        const AUTH_KEY = 'ark_kb_auth_v1';
        function isAuthed() { try { return localStorage.getItem(AUTH_KEY) === '1'; } catch (e) { return false; } }
        function setAuthed() { try { localStorage.setItem(AUTH_KEY, '1'); } catch (e) {} }

        function showLoginError() {

        function tryLogin(pwd) {

        }

        let allRecords = []; let fuse = null; let currentTag = null; let currentCategory = 'all'; let favorites = new Set(); let loadStartTime = 0; let segmenter = null;
        const PLACEHOLDERS = ['输入关键词搜索，如 "质押教程"', '输入 #标签 筛选，如 #活动', '可直接粘贴任意网址搜索，如 https://example.com/xxx', '支持繁体中文，如 "錢包"'];
        let placeholderIndex = 0; let searchInput;
        // 知识库文件清单（按分类）
        const FILES = ['活动公告.txt', '提案政策.txt', '工作室事务.txt', '常用话术.txt', '产品操作.txt', '常见FAQ.txt', '地址合约.txt', '最新动态.txt'];
        const FILE_CATEGORIES = {
            '活动公告.txt': '活动公告', '提案政策.txt': '提案政策', '工作室事务.txt': '工作室事务',
            '常用话术.txt': '常用话术', '产品操作.txt': '产品操作',
            '常见FAQ.txt': '常见FAQ', '地址合约.txt': '地址合约',
            '最新动态.txt': '最新动态'
        };
        const CATEGORY_META = {
            'all':         { icon: '📋', label: '全部内容' },
            '活动公告':     { icon: '🎯', label: '活动公告' },
            '提案政策':     { icon: '📜', label: '提案政策' },
            '工作室事务':   { icon: '🏠', label: '工作室事务' },
            '常用话术':     { icon: '💬', label: '常用话术' },
            '产品操作':     { icon: '📱', label: '产品操作' },
            '常见FAQ':     { icon: '❓', label: '常见 FAQ' },
            '地址合约':     { icon: '💰', label: '地址合约' },
            '最新动态':     { icon: '📢', label: '最新动态' },
            'favorites':   { icon: '⭐', label: '我的收藏' }
        };
        async function initOpenCC() {
            try {
                // cn2t.js 是 opencc-js 自带的「简→繁」preset bundle，
                // 字典已经内联在 JS 里，不需要外部 s2t.json 文件（之前用 .json URL 的方式 404）。
                await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js';
                    s.async = true;
                    s.onload = resolve;
                    s.onerror = reject;
                    document.head.appendChild(s);
                });
                // 变量名 convertToSimplified 沿用旧名以保持 search 调用方不动，
                // 实际语义是「把 query 转成繁体再去搜」，因为知识库条目以繁中为主。
                const converter = window.OpenCC.Converter({ from: 'cn', to: 'tw' });
                window.convertToSimplified = converter;
                console.log('[繁简转换] 加载完成');
            } catch (e) {
                console.warn('OpenCC 加载失败，使用原始文本:', e);
                window.convertToSimplified = (text) => text;
            }
        }
        async function initSegmenter() {
            try {
                // segmentit@2.0.3 ESM bundle（package 里没有 .es.min.js，且这个 bundle 用命名导出 { Segment }）
                const { Segment } = await import('https://cdn.jsdelivr.net/npm/segmentit@2.0.3/dist/esm/segmentit.js');
                segmenter = new Segment();
                console.log('[分词] 加载完成');
            } catch (e) { console.warn('[分词] 加载失败:', e); segmenter = null; }
        }
        function tokenize(text) {
            if (!text) return [];
            if (segmenter) {
                try { return segmenter.doSegment(text, { simple: true }); }
                catch (e) { return text.split(/\s+/).filter(w => w); }
            }
            return text.split(/\s+/).filter(w => w);
        }
        function generateHotKeywords() {
            const wordCount = {};
            const fieldPattern = /^\[.+\]:$/;
            for (const record of allRecords) {
                for (const keyword of record.keywords) {
                    const words = keyword.split(/\s+/).filter(w => w);
                    for (const word of words) {
                        if (word.length < 2 || /^\d+$/.test(word) || fieldPattern.test(word) || word.startsWith('#')) continue;
                        wordCount[word] = (wordCount[word] || 0) + 1;
                    }
                }
            }
            const sorted = Object.entries(wordCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6)
                .map(([word]) => word);
            const tagsBar = document.getElementById('tagsBar');
            tagsBar.innerHTML = '<button class="tag-btn active" data-tag="">全部</button>' +
                sorted.map(word => `<button class="tag-btn" data-tag="${escapeHTML(word)}">${escapeHTML(word)}</button>`).join('');
            attachTagListeners();
        }
        function attachTagListeners() {
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tag = btn.dataset.tag;
                    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                    if (tag === '') {
                        currentTag = null;
                        searchInput.value = '';
                        btn.classList.add('active');
                        showAllRecords();
                    } else if (currentTag === tag) {
                        currentTag = null;
                        btn.classList.remove('active');
                        searchInput.value = '';
                        showAllRecords();
                    } else {
                        currentTag = tag;
                        btn.classList.add('active');
                        searchInput.value = tag;
                        performSearch(tag);
                    }
                });
            });
        }
        async function loadData() {
            loadStartTime = Date.now();
            const records = []; const timestamp = Date.now();
            for (const file of FILES) {
                try {
                    const response = await fetch(`data/${file}?t=${timestamp}`);
                    if (!response.ok) throw new Error(`Failed to load ${file}`);
                    const text = await response.text();
                    const fileRecords = parseRecords(text, file);
                    records.push(...fileRecords);
                } catch (error) { console.warn(`加载 ${file} 失败:`, error); }
            }
            allRecords = records; initFuse();
            console.log(`[知识库] 加载完成，共 ${records.length} 条记录`);
            const loadTime = ((Date.now() - loadStartTime) / 1000).toFixed(2);
            document.getElementById('loadTime').textContent = `数据加载: ${loadTime}s | ${new Date().toLocaleString('zh-CN')}`;
            return records;
        }
        function parseRecords(text, sourceFile) {
            const records = []; const lines = text.split(/\r?\n/); const blocks = []; let currentBlock = '';
            for (const line of lines) {
                if (line.trim() === '---') { if (currentBlock.trim()) blocks.push(currentBlock.trim()); currentBlock = ''; }
                else { currentBlock += line + '\n'; }
            }
            if (currentBlock.trim()) blocks.push(currentBlock.trim());
            for (const block of blocks) { const record = parseBlock(block, sourceFile); if (record) records.push(record); }
            return records;
        }
        function parseBlock(block, sourceFile) {
            const blockStart = block.indexOf('[问题/关键词]:'); const blockEnd = block.indexOf('[链接]:');
            if (blockStart === -1) return null;
            const answerStart = block.indexOf('[答案]:', blockStart);
            if (answerStart === -1) return null;
            let answerContent = '', linkContent = '';
            if (blockEnd !== -1 && blockEnd > answerStart) {
                answerContent = block.substring(answerStart + '[答案]:'.length, blockEnd).trim();
                const afterLink = block.indexOf('\n', blockEnd);
                linkContent = block.substring(blockEnd + '[链接]:'.length, afterLink !== -1 ? afterLink : block.length).trim();
            } else { answerContent = block.substring(answerStart + '[答案]:'.length).trim(); }
            if (!answerContent) return null;
            const questionSection = block.substring(blockStart + '[问题/关键词]:'.length, answerStart).trim();
            const keywords = questionSection.split(/\s+/).filter(k => k);
            let tags = [];
            const tagMatch = block.match(/\[标签\]:\s*([^\n]+)/);
            if (tagMatch) { tags = tagMatch[1].trim().split(/\s+/).filter(t => t.startsWith('#')); }
            let link = linkContent.replace(/^`|`$/g, '').trim();
            if (link === '') link = '';
            // 图片字段（可选）
            let image = '';
            const imgMatch = block.match(/\[图片\]:\s*([^\n]+)/);
            if (imgMatch) { image = imgMatch[1].trim(); }
            // 来源（可选，例如某个公告/提案 ID）
            let source = '';
            const sourceMatch = block.substring(blockStart, answerStart).match(/\[来源\]:\s*([^\n]+)/);
            if (sourceMatch) { source = sourceMatch[1].trim(); }
            // 分类（基于源文件）
            const category = FILE_CATEGORIES[sourceFile] || '常见FAQ';
            // 唯一 ID（用于收藏）
            // ID 仅基于 sourceFile + keywords（不含答案内容），这样编辑答案不会让收藏静默断联
            const id = md5(sourceFile + '|' + keywords.join(' '));
            return { id, keywords, tags, answer: answerContent, link, image, source, category, sourceFile, searchText: [...keywords, answerContent].join(' ') };
        }
        function initFuse() {
            // 用 searchText（keywords + answer 拼接）作为单一搜索字段，
            // 避免加权 keys 在某字段没匹配时把整体 score 拉爆。
            // 例：搜「静态燃烧」，keywords 里只有「燃烧」，没「静态」，
            // 旧版按 keywords:0.7 / answer:0.3 加权后 score≈0.6 > 0.35 阈值被过滤掉。
            const options = {
                keys: ['searchText'],
                includeScore: true,
                threshold: 0.35,
                distance: 100,
                minMatchCharLength: 1,
                ignoreLocation: true
            };
            fuse = new Fuse(allRecords, options);
        }
        async function performSearch(query) {
            if (!query.trim()) { showAllRecords(); return; }
            const linkSearch = query.match(/^https?:\/\/[^\s]+$/);
            if (linkSearch) {
                const result = allRecords.find(r => r.link === query);
                if (result) { await displayResults([result]); }
                else { displayEmpty('未找到该链接对应的记录', '请检查链接是否正确'); }
                return;
            }
            if (query.startsWith('#')) {
                currentTag = query;
                const tagResults = allRecords.filter(r => r.tags.some(t => t.toLowerCase().includes(currentTag.toLowerCase())));
                await displayResults(tagResults, query); return;
            }
            currentTag = null;
            // 两段式搜索：
            //   1) Substring 精确匹配（简繁两版 needle 都查）→ score=0，排在最前
            //   2) Fuse fuzzy 匹配（用来补充近似命中）→ 按 Fuse score 排序追加
            //
            // 为什么不再用 Fuse score 阈值过滤：因为 searchText 字段很长（keywords+answer 拼接），
            // Fuse 的 score 计算对长字段偏高（例：「静态燃烧」命中 ark-015 score=0.59），
            // 0.35 阈值会误杀真正精确匹配的 record。
            // Substring 已经保证「任何内容都能搜到」，Fuse 只用来补充 typo/部分匹配的近似项。
            const simplifiedQuery = window.convertToSimplified ? window.convertToSimplified(query) : query;
            const queryVariants = [...new Set([query, simplifiedQuery])];  // 去重，简繁两版都要查
            const fuseResults = [];
            const foundIds = new Set();
            // Pass 1: substring 精确匹配（保证任何内容都能搜到）
            for (const v of queryVariants) {
                const needle = v.toLowerCase();
                for (const rec of allRecords) {
                    if (foundIds.has(rec.id)) continue;
                    if (rec.searchText && rec.searchText.toLowerCase().includes(needle)) {
                        fuseResults.push({ item: rec, score: 0 });
                        foundIds.add(rec.id);
                    }
                }
            }
            // Pass 2: Fuse fuzzy 补充（multi-token 拆词搜，每个 token 单独跑）
            for (const v of queryVariants) {
                const tokens = tokenize(v).filter(t => t.length >= 2);
                const queries = tokens.length > 1 ? tokens : [v];
                for (const q of queries) {
                    fuse.search(q).forEach(r => {
                        if (foundIds.has(r.item.id)) return;
                        fuseResults.push(r);
                        foundIds.add(r.item.id);
                    });
                }
            }
            if (fuseResults.length > 0) {
                fuseResults.sort((a, b) => a.score - b.score);
                await displayResults(fuseResults.map(r => r.item), query);
            }
            else { displayEmpty('未找到相关内容', '建议更换关键词或去掉标签筛选'); }
        }
        function showAllRecords() { displayResults(allRecords, ''); }
        async function displayResults(records, query = '') {
            // 「最新动态」分类：按 [来源] 分组，公告在上、Q&A 嵌套在下面
            if (currentCategory === '最新动态') {
                return displayLatestNews(records, query);
            }
            const container = document.getElementById('resultsContainer');
            const statsBar = document.getElementById('statsBar');
            if (records.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">未找到相关内容</div><div class="empty-hint">建议更换关键词或去掉标签筛选</div></div>`;
                statsBar.style.display = 'none'; return;
            }
            statsBar.style.display = 'flex';
            document.getElementById('resultsCount').textContent = `找到 ${records.length} 条结果`;
            const htmlResults = records.map((record, index) => createResultHTML(record, query, index));
            container.innerHTML = htmlResults.join('');
            attachResultListeners();
        }
        // 最新动态分类：按 [来源] 分组渲染，公告（含 [链接] 字段）作 header，Q&A 嵌套展示
        async function displayLatestNews(records, query = '') {
            const container = document.getElementById('resultsContainer');
            const statsBar = document.getElementById('statsBar');
            if (records.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">还没有最新动态</div><div class="empty-hint">下一条公告发布后会出现在这里</div></div>`;
                statsBar.style.display = 'none'; return;
            }
            // 按 [来源] 分组
            const groups = new Map();
            for (const r of records) {
                const src = r.source || '_root';
                if (!groups.has(src)) groups.set(src, []);
                groups.get(src).push(r);
            }
            // 渲染：每个组先放公告（含 [链接] 字段的），再放 Q&A
            const htmlParts = [];
            let total = 0;
            for (const [src, entries] of groups) {
                const announcement = entries.find(e => e.link);
                const qas = entries.filter(e => !e.link);
                if (announcement) {
                    htmlParts.push(`<div class="latest-announcement-wrapper">${createResultHTML(announcement, query, total)}</div>`);
                    total++;
                }
                if (qas.length > 0) {
                    const qaTitle = src === '_root' ? '' : `<h3 class="latest-qa-title">💬 关联问答 <span class="latest-qa-count">${qas.length} 条</span></h3>`;
                    htmlParts.push(qaTitle);
                    htmlParts.push('<div class="latest-qa-list">');
                    for (const qa of qas) {
                        htmlParts.push(createResultHTML(qa, query, total));
                        total++;
                    }
                    htmlParts.push('</div>');
                } else if (!announcement) {
                    // 只有 Q&A 没有公告的情况
                    for (const qa of entries) {
                        htmlParts.push(createResultHTML(qa, query, total));
                        total++;
                    }
                }
            }
            statsBar.style.display = 'flex';
            document.getElementById('resultsCount').textContent = `找到 ${total} 条结果`;
            container.innerHTML = htmlParts.join('');
            attachResultListeners();
        }
        function createResultHTML(record, query, index) {
            let answerHtml = processAnswer(record.answer);
            if (query && query.trim() && !query.startsWith('#')) {
                answerHtml = highlightInHtml(answerHtml, query);
            }
            const keywordsHTML = record.keywords.slice(0, 5).map(k => `<span class="keyword-tag">${escapeHTML(k)}</span>`).join('');
            const linkHTML = record.link ? `<a href="${escapeHTML(record.link)}" target="_blank" rel="noopener">🔗 查看链接</a>` : '';
            const isFav = favorites.has(record.id);
            const favIcon = isFav ? '★' : '☆';
            const imageHtml = record.image ? `<img class="result-image" src="${escapeHTML(record.image)}" loading="lazy" alt="${escapeHTML(record.keywords.slice(0, 3).join(' '))}" onerror="this.style.display='none'" />` : '';
            return `<div class="result-item" style="animation-delay: ${Math.min(index, 12) * 0.05}s" data-id="${record.id}"><div class="result-header"><div class="result-meta">${record.tags.map(t => `<span class="tag">${escapeHTML(t)}</span>`).join('')}</div><div class="result-header-right"><span class="source-file">📄 ${escapeHTML(record.sourceFile)}</span><button class="fav-btn ${isFav ? 'active' : ''}" data-id="${record.id}" title="${isFav ? '取消收藏' : '收藏'}">${favIcon}</button></div></div>${imageHtml}<div class="result-answer">${answerHtml}</div><div class="result-footer"><div class="keywords">${keywordsHTML}</div><div class="action-btns">${linkHTML}<button class="action-btn copy-btn" data-answer="${escapeAttr(record.answer)}">📋 复制答案</button></div></div></div>`;
        }
        // 简单 MD5（用于记录 ID）
        function md5(str) {
            function rh(n) { let j, s = ''; for (j = 0; j <= 3; j++) s += ((n >> (j * 8 + 4)) & 0x0F).toString(16) + ((n >> (j * 8)) & 0x0F).toString(16); return s; }
            function ad(x, y) { const l = (x & 0xFFFF) + (y & 0xFFFF), m = (x >> 16) + (y >> 16) + (l >> 16); return (m << 16) | (l & 0xFFFF); }
            function rl(n, c) { return (n << c) | (n >>> (32 - c)); }
            function cm(q, a, b, x, s, t) { return ad(rl(ad(ad(a, q), ad(x, t)), s), b); }
            function ff(a, b, c, d, x, s, t) { return cm((b & d) | ((~b) & c), a, b, x, s, t); }
            function gg(a, b, c, d, x, s, t) { return cm((b & c) | (b & d) | (c & d), a, b, x, s, t); }

        function highlightInHtml(htmlText, query) {
            const simplifiedQuery = window.convertToSimplified ? window.convertToSimplified(query) : query;
            const tokens = tokenize(simplifiedQuery);
            const longTokens = tokens.filter(t => t.length >= 2);
            if (longTokens.length === 0) { return htmlText; }
            let result = htmlText;
            for (const token of longTokens) {
                const escaped = token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escaped, 'gi');
                result = result.replace(regex, match => `<mark>${match}</mark>`);
            }
            return result;
        }
        function processAnswer(text) {
            let processed = escapeHTML(text);
            processed = processed.replace(/`([^`]+)`/g, '<code>$1</code>');
            processed = processed.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
            processed = processed.replace(/(0x[a-fA-F0-9]{40})/g, `<span class="contract-address">$1 <a href="https://bscscan.com/address/$1" target="_blank">🔍</a> <button class="copy-btn" onclick="copyAddress(this, '$1')">📋</button></span>`);
            return processed;
        }
        function escapeHTML(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
        function escapeAttr(text) { return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
        function copyAddress(btn, address) { navigator.clipboard.writeText(address).then(() => { showToast('地址已复制'); btn.textContent = '✓'; setTimeout(() => btn.textContent = '📋', 1500); }); }
        function attachResultListeners() {
            document.querySelectorAll('.copy-btn[data-answer]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const answer = btn.dataset.answer;
                    navigator.clipboard.writeText(answer).then(() => {
                        btn.classList.add('copy-success'); btn.innerHTML = '✓ 已复制';
                        showToast('答案已复制到剪贴板', true);
                        setTimeout(() => { btn.classList.remove('copy-success'); btn.innerHTML = '📋 复制答案'; }, 2000);
                    });
                });
            });
            // 收藏按钮
            document.querySelectorAll('.fav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(btn.dataset.id);
                });
            });
            // 图片点击放大
            document.querySelectorAll('.result-image').forEach(img => {
                img.addEventListener('click', () => openImageModal(img.src));
            });
        }

        // ============ 侧边栏 / 分类 / 收藏 ============
        function renderSidebar() {
            const nav = document.getElementById('sidebarNav');
            const counts = countByCategory();
            // 分类列表
            const cats = ['all', '活动公告', '提案政策', '工作室事务', '常用话术', '产品操作', '常见FAQ', '地址合约', '最新动态'];
            const items = cats.map(cat => {
                const meta = CATEGORY_META[cat];
                const count = cat === 'all' ? allRecords.length : (counts[cat] || 0);
                return `<div class="sidebar-item ${currentCategory === cat ? 'active' : ''}" data-cat="${cat}">
                    <span class="item-icon">${meta.icon}</span>
                    <span class="item-label">${meta.label}</span>
                    <span class="item-count">${count}</span>
                </div>`;
            }).join('');
            // 收藏（追加在底部）
            const favItem = `<div class="sidebar-item ${currentCategory === 'favorites' ? 'active' : ''}" data-cat="favorites">
                <span class="item-icon">⭐</span>
                <span class="item-label">我的收藏</span>
                <span class="item-count">${favorites.size}</span>
            </div>`;
            nav.innerHTML = items + favItem;
            // 绑定点击
            nav.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', () => {
                    setCategory(item.dataset.cat);
                    // 移动端点击后自动关闭侧边栏
                    if (window.innerWidth <= 768) closeSidebar();
                });
            });
        }
        function countByCategory() {
            const counts = {};
            for (const r of allRecords) {
                counts[r.category] = (counts[r.category] || 0) + 1;
            }
            return counts;
        }
        function setCategory(cat) {
            currentCategory = cat;
            currentTag = null;
            searchInput.value = '';
            renderSidebar();
            refreshResults();
        }
        function refreshResults() {
            let list = allRecords;
            if (currentCategory === 'favorites') {
                list = list.filter(r => favorites.has(r.id));
            } else if (currentCategory !== 'all') {
                list = list.filter(r => r.category === currentCategory);
            }
            displayResults(list, '');
        }
        function loadFavorites() {
            try {
                const stored = localStorage.getItem('ark-kb-favorites');
                if (stored) favorites = new Set(JSON.parse(stored));
            } catch (e) { favorites = new Set(); }
        }
        function saveFavorites() {
            try {
                localStorage.setItem('ark-kb-favorites', JSON.stringify([...favorites]));
            } catch (e) {}
        }
        function toggleFavorite(id) {
            if (favorites.has(id)) {
                favorites.delete(id);
                showToast('已取消收藏');
            } else {
                favorites.add(id);
                showToast('已加入收藏 ⭐', true);
            }
            saveFavorites();
            // 重新渲染侧边栏和结果（如果当前在收藏页）
            renderSidebar();
            if (currentCategory === 'favorites') refreshResults();
        }
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarBackdrop').classList.add('show');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarBackdrop').classList.remove('show');
        }
        function openImageModal(src) {
            let modal = document.getElementById('imageModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'imageModal';
                modal.className = 'image-modal';
                modal.innerHTML = '<img alt="预览" />';
                modal.addEventListener('click', () => modal.classList.remove('show'));
                document.body.appendChild(modal);
            }
            modal.querySelector('img').src = src;
            modal.classList.add('show');
        }
        function displayEmpty(title, hint) {
            const container = document.getElementById('resultsContainer');
            const statsBar = document.getElementById('statsBar');
            statsBar.style.display = 'none';
            container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">${title}</div><div class="empty-hint">${hint}</div></div>`;
        }
        function showToast(message, success = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (success ? ' success' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        function cyclePlaceholder() {
            if (!searchInput.value && placeholderIndex !== undefined) { searchInput.placeholder = PLACEHOLDERS[placeholderIndex % PLACEHOLDERS.length]; placeholderIndex++; }
        }
        let debounceTimer;
        function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { performSearch(searchInput.value); }, 300); }
        // ============ 智能搜索专用 Fuse（加权 keys） ============
        // 关键词 0.7 + 答案 0.3，解决 Fuse.search 整句 0 命中 / 弱匹配问题
        // 让"抖音"等在 answer 字段的关键词也能浮上来
        let smartFuse = null;
        function initSmartFuse() {
            smartFuse = new Fuse(allRecords, {
                keys: [
                    { name: 'keywords', weight: 0.7 },
                    { name: 'answer', weight: 0.3 }
                ],
                includeScore: true,
                threshold: 0.6,
                distance: 200,
                minMatchCharLength: 2,
                ignoreLocation: true

        }
        async function startApp() {
            searchInput = document.getElementById('searchInput');
            await initOpenCC();
            await initSegmenter();
            await loadData();
            initSmartFuse();
            loadFavorites();
            renderSidebar();
            generateHotKeywords();
            searchInput.addEventListener('input', debounceSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { searchInput.value = ''; currentTag = null; setCategory('all'); }
                if (e.key === 'Enter') { clearTimeout(debounceTimer); performSearch(searchInput.value); }

            bindSmartSearch();
            document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); } });

        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

        // ============ 智能搜索 (AI) ============
        // Cloudflare Worker → 智谱 GLM-4.7-Flash (RAG)
        const SMART_WORKER_URL = 'https://white-recipe-de08ark-kb-search.btcwilliamxx.workers.dev';
        let smartInput, smartResultsEl, smartDebounceTimer;

        function bindSmartSearch() {
            smartInput = document.getElementById('smartSearchInput');
            smartResultsEl = document.getElementById('smartResults');
            smartInput.addEventListener('input', debounceSmartSearch);
            smartInput.addEventListener('keydown', (e) => {

        function debounceSmartSearch() {
            clearTimeout(smartDebounceTimer);

        function clearSmartSearch() {
            smartInput.value = '';
            smartResultsEl.classList.remove('show');

        // 复用现有 Fuse + substring 逻辑，取 top-N 命中
        function getTopKBHits(query, n) {
            const simplifiedQuery = window.convertToSimplified ? window.convertToSimplified(query) : query;
            const queryVariants = [...new Set([query, simplifiedQuery])];
            const foundIds = new Set();
            const hits = [];
            // Pass 1: substring 精确匹配（score 强制为 0，最高优先级）
            for (const v of queryVariants) {
                const needle = v.toLowerCase();
                for (const rec of allRecords) {
                    if (foundIds.has(rec.id)) continue;
                    if (rec.searchText && rec.searchText.toLowerCase().includes(needle)) {
                        hits.push(rec);
                        foundIds.add(rec.id);
                        if (hits.length >= n) return hits;
                    }
                }
            }
            // Pass 2: 多策略切词 + Fuse 模糊
            // 用 Map 收集每条记录的 best score，最后按 score 排序取 top-N
            // 避免 n-gram 太激进撞到一堆不相关条目都被收进来
            const bestScore = new Map(); // id → {record, score}
            const subQueries = new Set();
            for (const v of queryVariants) {
                v.split(/[\s,，。？！、；:：]+/).forEach(p => { if (p.length >= 2) subQueries.add(p); });
                tokenize(v).filter(t => t.length >= 2).forEach(t => subQueries.add(t));
                for (let i = 0; i <= v.length - 2; i++) {
                    subQueries.add(v.substr(i, 2));
                }
            }
            for (const q of subQueries) {
                const results = smartFuse.search(q);
                for (const r of results) {
                    if (foundIds.has(r.item.id)) continue;
                    const existing = bestScore.get(r.item.id);
                    if (!existing || r.score < existing.score) {
                        bestScore.set(r.item.id, { record: r.item, score: r.score });
                    }
                }
            }
            // 按 best score 排序，取 top-N
            const sorted = [...bestScore.values()].sort((a, b) => a.score - b.score);
            for (const entry of sorted) {
                if (foundIds.has(entry.record.id)) continue;
                hits.push(entry.record);
                foundIds.add(entry.record.id);
                if (hits.length >= n) break;
            }
            return hits;
        }

        async function performSmartSearch(query) {
            if (!query.trim()) {
                smartResultsEl.classList.remove('show');
                smartResultsEl.innerHTML = '';
                return;
            }

            smartResultsEl.classList.add('show');
            smartResultsEl.innerHTML = '<div class="smart-loading">🤖 AI 思考中...（首次冷启动约 2-3 秒）</div>';

            const kbHits = getTopKBHits(query, 8);

            try {
                const resp = await fetch(SMART_WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: query,
                        contexts: kbHits.map(r => ({
                            title: r.keywords.slice(0, 5).join(' '),
                            body: r.answer
                        }))
                    })
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error(`Worker ${resp.status}: ${errText.slice(0, 200)}`);
                }
                const data = await resp.json();
                const answer = data.answer || '（模型无回复）';
                renderSmartResult(query, kbHits, answer);
            } catch (e) {
                smartResultsEl.innerHTML = `<div class="smart-error">⚠️ AI 调用失败<div class="smart-error-hint">${escapeHTML(e.message)}<br>检查 Worker URL 是否可达，或网络是否通畅</div></div>`;
            }
        }

        function renderSmartResult(query, kbHits, answer) {
            const noKb = kbHits.length === 0;

            // KB 原文 section
            let kbSection;
            if (noKb) {
                kbSection = `<div class="smart-no-kb">📭 知识库无相关条目，AI 将基于通用理解回复（仅供参考，不保证准确）</div>`;
            } else {
                kbSection = `<div class="smart-kb-hits">
                    <div class="smart-section-title">📚 KB 话术原文（${kbHits.length} 条命中）</div>

                        const titleTags = r.tags.length > 0
                            ? ' ' + r.tags.slice(0, 3).map(t => `<span style="color:var(--text-muted);font-size:0.75rem;font-weight:normal;">${escapeHTML(t)}</span>`).join(' ')

                        return `<div class="smart-kb-item">
                            <div class="smart-kb-title">${i + 1}. ${escapeHTML(r.keywords.slice(0, 5).join(' '))}${titleTags}</div>
                            <div class="smart-kb-body">${escapeHTML(body)}</div>
                        </div>`;
                    }).join('')}
                </div>`;
            }

            // AI 解读 section
            const aiSection = `<div class="smart-ai-box">
                <div class="smart-section-title">🤖 AI 解读</div>
                <div class="smart-ai-content">${escapeHTML(answer).replace(/\n/g, '<br>')}</div>
                <div class="smart-ai-warn">⚠️ 内容由 AI 生成，仅供参考。客服使用前请人工核对</div>
            </div>`;

            smartResultsEl.innerHTML = kbSection + aiSection;
        }
        // ============ 入口：根据密码决定是否启动主程序 ============
        if (isAuthed()) {
            document.getElementById('loginOverlay').classList.add('hidden');
            startApp();
        } else {
