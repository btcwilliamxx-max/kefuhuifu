<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARK 客服知识库</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="description" content="ARK 项目客服快速搜索工具">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a24;
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #00d4ff;
            --accent-glow: rgba(0, 212, 255, 0.15);
            --accent-hover: #00e5ff;
            --border: rgba(255, 255, 255, 0.08);
            --success: #10b981;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', 'JetBrains Mono', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px; z-index: 0;
        }
        .bg-glow {
            position: fixed; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(0, 212, 255, 0.08) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
            pointer-events: none; z-index: 0;
        }
        .container { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 50px; }
        .logo { display: inline-flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .logo-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 0 30px var(--accent-glow);
        }
        h1 { font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #fff 0%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: var(--text-secondary); font-size: 0.95rem; margin-top: 8px; }
        .quicklinks {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
            margin: 0 0 30px;
        }
        .quicklink-card {
            display: flex; align-items: center; gap: 14px;
            padding: 16px 18px;
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            border: 1px solid var(--border); border-radius: 14px;
            color: var(--text-primary); text-decoration: none;
            transition: all 0.25s ease; position: relative; overflow: hidden;
            flex: 1 1 320px; max-width: 420px;
        }
        .quicklink-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
            background: var(--accent); transform: scaleY(0); transform-origin: top;
            transition: transform 0.25s ease;
        }
        .quicklink-card:hover {
            border-color: var(--accent); transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.15);
        }
        .quicklink-card:hover::before { transform: scaleY(1); }
        .quicklink-card:hover .quicklink-arrow { transform: translateX(4px); color: var(--accent); }
        .quicklink-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(0, 212, 255, 0.12); display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; flex-shrink: 0;
        }
        .quicklink-text { flex: 1; min-width: 0; }
        .quicklink-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); }
        .quicklink-sub { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .quicklink-arrow { color: var(--text-muted); font-size: 1.1rem; transition: all 0.25s ease; flex-shrink: 0; }
        @media (max-width: 480px) {
            .quicklink-card { flex: 1 1 100%; max-width: none; }
        }
        .tag-loading { color: var(--text-muted); font-size: 0.875rem; padding: 10px 0; }

        /* === Chat 区域（AI 客服助手） === */
        .chat-section {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.08) 0%, rgba(0, 212, 255, 0.04) 100%);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 16px;
            padding: 0;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px;
            background: rgba(139, 92, 246, 0.06);
            border-bottom: 1px solid rgba(139, 92, 246, 0.2);
        }
        .chat-header-left {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.95rem; font-weight: 600;
        }
        .chat-header-left .icon { font-size: 1.2rem; }
        .chat-header-right { display: flex; gap: 6px; align-items: center; }
        .chat-header-btn {
            font-size: 0.72rem; padding: 5px 10px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg-secondary);
            color: var(--text-muted); cursor: pointer;
            transition: all 0.2s;
        }
        .chat-header-btn:hover { color: var(--text-primary); border-color: var(--accent); }
        .chat-body {
            padding: 16px 18px;
            max-height: 500px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 14px;
        }
        .chat-empty {
            color: var(--text-muted); font-size: 0.85rem; text-align: center;
            padding: 24px 0;
        }
        .chat-msg {
            display: flex; flex-direction: column; gap: 4px;
            animation: chat-fade-in 0.3s ease;
        }
        @keyframes chat-fade-in {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-msg-role {
            font-size: 0.7rem; color: var(--text-muted);
            font-weight: 600; letter-spacing: 0.3px;
        }
        .chat-msg.user .chat-msg-role { color: var(--accent); }
        .chat-msg-bubble {
            padding: 12px 14px; border-radius: 12px;
            font-size: 0.92rem; line-height: 1.65;
            white-space: pre-wrap; word-break: break-word;
        }
        .chat-msg.user .chat-msg-bubble {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .chat-msg.assistant .chat-msg-bubble {
            background: rgba(139, 92, 246, 0.12);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: var(--text-primary);
        }
        .chat-msg.error .chat-msg-bubble {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }
        .chat-msg-meta {
            display: flex; align-items: center; gap: 10px;
            margin-top: 6px; font-size: 0.7rem; color: var(--text-muted);
        }
        .chat-msg-warn {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: #fbbf24;
            padding: 8px 10px; border-radius: 8px;
            font-size: 0.78rem; line-height: 1.5;
            margin-top: 8px;
        }
        .chat-msg-actions { display: flex; gap: 6px; }
        .chat-msg-action {
            background: transparent; border: none;
            color: var(--text-muted); cursor: pointer;
            font-size: 0.75rem; padding: 2px 6px; border-radius: 4px;
        }
        .chat-msg-action:hover { color: var(--accent); background: rgba(139, 92, 246, 0.1); }
        .chat-msg-refs {
            margin-top: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
        }
        .chat-msg-refs summary {
            cursor: pointer; font-size: 0.78rem;
            color: var(--text-secondary); font-weight: 500;
            user-select: none;
        }
        .chat-msg-refs summary:hover { color: var(--accent); }
        .chat-msg-ref-item {
            margin-top: 8px; padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 0.82rem; line-height: 1.55;
        }
        .chat-msg-ref-item:first-of-type { border-top: none; padding-top: 4px; margin-top: 4px; }
        .chat-msg-ref-title {
            font-weight: 600; color: var(--accent); margin-bottom: 4px;
            font-size: 0.78rem;
        }
        .chat-input-area {
            display: flex; gap: 8px;
            padding: 14px 18px;
            border-top: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.04);
        }
        .chat-input {
            flex: 1;
            padding: 11px 14px;
            font-size: 0.9rem; font-family: inherit;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            outline: none;
            resize: none;
            max-height: 100px;
            line-height: 1.5;
        }
        .chat-input:focus { border-color: #8b5cf6; box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18); }
        .chat-send-btn {
            padding: 0 18px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
            border: none; border-radius: 10px;
            color: #fff; font-weight: 600; font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chat-send-btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.4); }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .chat-status {
            font-size: 0.75rem; color: var(--text-muted);
            padding: 4px 18px 10px;
            text-align: center;
        }
        .chat-loading-dot {
            display: inline-block;
            width: 6px; height: 6px; border-radius: 50%;
            background: #8b5cf6;
            animation: chat-pulse 1.4s infinite ease-in-out both;
        }
        .chat-loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .chat-loading-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes chat-pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .search-container { position: relative; margin-bottom: 24px; }
        .search-box { width: 100%; padding: 18px 24px; padding-left: 54px; font-size: 1rem; font-family: inherit; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; color: var(--text-primary); outline: none; transition: all 0.3s ease; }
        .search-box::placeholder { color: var(--text-muted); }
        .search-box:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
        .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
        .shortcuts { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
        .key-hint { background: var(--bg-tertiary); padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; color: var(--text-muted); border: 1px solid var(--border); }
        .tags-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .tag-btn { padding: 10px 18px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 10px; color: var(--text-secondary); font-size: 0.875rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .tag-btn:hover { background: var(--bg-tertiary); border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
        .tag-btn.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); font-weight: 600; }
        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 12px 16px; background: var(--bg-secondary); border-radius: 10px; border: 1px solid var(--border); font-size: 0.85rem; color: var(--text-secondary); }
        .stats-bar .load-time { color: var(--accent); font-family: 'JetBrains Mono', monospace; }
        .results-count { color: var(--text-muted); }
        .result-item { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 24px; transition: all 0.3s ease; animation: fadeInUp 0.4s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .result-item:hover { border-color: rgba(0, 212, 255, 0.3); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
        /* 最新动态分类：公告 + 嵌套 Q&A */
        .latest-announcement-wrapper { margin-bottom: 16px; }
        .latest-announcement-wrapper .result-item { border-left: 3px solid var(--accent); }
        .latest-qa-title { color: var(--text-secondary); font-size: 0.95rem; font-weight: 600; margin: 24px 0 12px 4px; padding-left: 8px; border-left: 2px solid rgba(0, 212, 255, 0.3); }
        .latest-qa-title .latest-qa-count { font-size: 0.75rem; color: var(--text-muted); font-weight: normal; margin-left: 6px; }
        .latest-qa-list .result-item { border-left: 2px solid rgba(255, 255, 255, 0.1); margin-left: 16px; padding: 18px 20px; }
        .latest-qa-list .result-item:hover { border-left-color: var(--accent); }
        /* 主条目 + 子条目 树状折叠列表 */
        .tree-children { margin-top: 14px; padding: 14px 14px 6px; background: rgba(0, 212, 255, 0.03); border: 1px dashed rgba(0, 212, 255, 0.25); border-radius: 12px; }
        .tree-children-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; color: var(--text-secondary); font-size: 0.85rem; }
        .tree-children-header .tree-toggle { background: none; border: 1px solid rgba(0, 212, 255, 0.3); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; transition: all 0.2s; }
        .tree-children-header .tree-toggle:hover { background: rgba(0, 212, 255, 0.1); }
        .tree-children.collapsed .tree-child-list { display: none; }
        .tree-child-list { display: flex; flex-direction: column; gap: 8px; }
        .tree-child { background: var(--bg-tertiary); border: 1px solid rgba(0, 212, 255, 0.15); border-radius: 10px; padding: 12px 14px; font-size: 0.85rem; transition: all 0.2s; }
        .tree-child:hover { border-color: var(--accent); background: rgba(0, 212, 255, 0.06); }
        .tree-child-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .tree-child-icon { color: var(--accent); font-size: 0.95rem; flex-shrink: 0; }
        .tree-child-title { font-weight: 600; color: var(--text-primary); font-size: 0.85rem; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tree-child-tag { padding: 2px 8px; background: rgba(0, 212, 255, 0.1); border-radius: 4px; font-size: 0.7rem; color: var(--accent); flex-shrink: 0; }
        .tree-child-body { color: var(--text-secondary); line-height: 1.65; font-size: 0.825rem; white-space: pre-wrap; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .tree-child.expanded .tree-child-body { max-height: 1200px; overflow-y: auto; margin-top: 4px; padding-top: 8px; border-top: 1px dashed rgba(255, 255, 255, 0.08); }
        .tree-child-body a { color: var(--accent); text-decoration: none; }
        .tree-child-body a:hover { text-decoration: underline; }
        .tree-child-body .contract-address { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 212, 255, 0.1); padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; color: var(--accent); word-break: break-all; }
        .result-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .result-meta { display: flex; gap: 8px; flex-wrap: wrap; }
        .tag { padding: 4px 10px; background: var(--bg-tertiary); border-radius: 6px; font-size: 0.75rem; color: var(--accent); border: 1px solid rgba(0, 212, 255, 0.2); }
        .source-file { font-size: 0.75rem; color: var(--text-muted); padding: 4px 10px; background: var(--bg-tertiary); border-radius: 6px; }
        .result-answer { font-size: 0.95rem; line-height: 1.7; color: var(--text-primary); margin-bottom: 12px; white-space: pre-wrap; }
        .result-answer a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
        .result-answer a:hover { color: var(--accent-hover); text-decoration: underline; }
        .result-answer .contract-address { display: inline-flex; align-items: center; gap: 6px; background: rgba(0, 212, 255, 0.1); padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; color: var(--accent); word-break: break-all; }
        .result-answer .contract-address a { color: var(--accent); font-size: 0.8rem; }
        .result-answer .contract-address .copy-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px; font-size: 0.8rem; transition: color 0.2s; }
        .result-answer .contract-address .copy-btn:hover { color: var(--accent); }
        .result-answer mark { background: #fde047; color: #1e293b; font-weight: 700; border-radius: 2px; padding: 0 2px; }
        .result-footer { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        .keywords { display: flex; flex-wrap: wrap; gap: 6px; }
        .keyword-tag { padding: 4px 10px; background: var(--bg-tertiary); border-radius: 6px; font-size: 0.75rem; color: var(--text-secondary); }
        .action-btns { display: flex; gap: 8px; }
        .action-btn { padding: 8px 14px; background: var(--bg-tertiary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary); font-size: 0.8rem; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; }
        .action-btn:hover { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }
        .action-btn.copy-success { background: var(--success); color: white; border-color: var(--success); }
        .empty-state { text-align: center; padding: 60px 20px; }
        .empty-icon { font-size: 4rem; margin-bottom: 16px; opacity: 0.5; }
        .empty-title { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 8px; }
        .empty-hint { color: var(--text-muted); font-size: 0.9rem; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-tertiary); border: 1px solid var(--border); padding: 12px 24px; border-radius: 10px; color: var(--text-primary); font-size: 0.9rem; z-index: 1000; transition: transform 0.3s ease; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.success { border-color: var(--success); background: rgba(16, 185, 129, 0.1); }
        @media (max-width: 640px) { .container { padding: 20px 16px; } h1 { font-size: 1.5rem; } .search-box { padding: 14px 16px; padding-left: 44px; font-size: 1rem; } .shortcuts { display: none; } .tags-bar { gap: 8px; } .tag-btn { padding: 8px 14px; font-size: 0.8rem; } .result-item { padding: 18px; } .result-footer { flex-direction: column; align-items: flex-start; } .action-btns { width: 100%; } .action-btn { flex: 1; justify-content: center; } }
        ::selection { background: var(--accent); color: var(--bg-primary); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* 回到顶部按钮 (右下角浮动) */
        .back-to-top {
            position: fixed; bottom: 30px; right: 30px; z-index: 999;
            width: 48px; height: 48px;
            background: var(--accent); color: var(--bg-primary);
            border: none; border-radius: 50%;
            font-size: 1.4rem; font-weight: 700;
            cursor: pointer;
            opacity: 0; visibility: hidden;
            transform: translateY(10px);
            transition: opacity 0.25s, visibility 0.25s, transform 0.25s, background 0.2s;
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.35);
        }
        .back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
        .back-to-top:hover { background: #5ee5ff; transform: translateY(-2px); }

        /* 登录遮罩 */
        .login-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-primary);
            background-image:
                linear-gradient(rgba(0, 212, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            display: flex; align-items: center; justify-content: center;
        }
        .login-overlay.hidden { display: none; }
        .login-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px; padding: 48px 40px;
            max-width: 420px; width: 100%; margin: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .login-icon { font-size: 3rem; text-align: center; margin-bottom: 12px; }
        .login-box h1 {
            text-align: center; font-size: 1.5rem; font-weight: 700;
            margin: 0 0 8px; color: var(--text-primary);
        }
        .login-sub { text-align: center; color: var(--text-muted); font-size: 0.875rem; margin: 0 0 28px; }
        .login-box input {
            width: 100%; padding: 14px 16px; background: var(--bg-tertiary);
            border: 1px solid var(--border); border-radius: 12px;
            color: var(--text-primary); font-size: 1rem; box-sizing: border-box;

    <script>
        // ============ 密码保护 ============
        // 修改下面这行换成你的密码（部署前在本地编辑器改这个文件，然后 commit + push）
        const KB_PASSWORD = 'ark2026';
        const AUTH_KEY = 'ark_kb_auth_v1';
        function isAuthed() { try { return localStorage.getItem(AUTH_KEY) === '1'; } catch (e) { return false; } }
        function setAuthed() { try { localStorage.setItem(AUTH_KEY, '1'); } catch (e) {} }
        function clearAuth() { try { localStorage.removeItem(AUTH_KEY); } catch (e) {} }
        function showLoginError() {
            const el = document.getElementById('loginError');
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }
        function tryLogin(pwd) {

                setAuthed();
                document.getElementById('loginOverlay').classList.add('hidden');
                document.getElementById('loginPassword').value = '';
                startApp();
            } else {
                showLoginError();
                const inp = document.getElementById('loginPassword');
                inp.value = '';
                inp.focus();
            }
        }
        function bindLogin() {
            const form = document.getElementById('loginForm');
            const inp = document.getElementById('loginPassword');
            form.addEventListener('submit', (e) => { e.preventDefault(); tryLogin(inp.value); });
            setTimeout(() => inp.focus(), 100);

        function logout() {
            clearAuth();
            location.reload();
        }

        let allRecords = []; let fuse = null; let currentTag = null; let currentCategory = 'all'; let favorites = new Set(); let loadStartTime = 0; let segmenter = null;
        const PLACEHOLDERS = ['输入关键词搜索，如 "质押教程"', '输入 #标签 筛选，如 #活动', '可直接粘贴任意网址搜索，如 https://example.com/xxx', '支持繁体中文，如 "錢包"'];
        let placeholderIndex = 0; let searchInput;
        // 知识库文件清单（按分类）
        const FILES = ['活动公告.txt', '提案政策.txt', '工作室事务.txt', '常用话术.txt', '产品操作.txt', '常见FAQ.txt', '地址合约.txt', '最新动态.txt'];
        const FILE_CATEGORIES = {
            '活动公告.txt': '活动公告', '提案政策.txt': '提案政策', '工作室事务.txt': '工作室事务',
            '常用话术.txt': '常用话术', '产品操作.txt': '产品操作',
            '常见FAQ.txt': '常见FAQ', '地址合约.txt': '地址合约',
            '最新动态.txt': '最新动态'
        };
        const CATEGORY_META = {
            'all':         { icon: '📋', label: '全部内容' },
            '活动公告':     { icon: '🎯', label: '活动公告' },
            '提案政策':     { icon: '📜', label: '提案政策' },
            '工作室事务':   { icon: '🏠', label: '工作室事务' },
            '常用话术':     { icon: '💬', label: '常用话术' },
            '产品操作':     { icon: '📱', label: '产品操作' },
            '常见FAQ':     { icon: '❓', label: '常见 FAQ' },
            '地址合约':     { icon: '💰', label: '地址合约' },
            '最新动态':     { icon: '📢', label: '最新动态' },
            'favorites':   { icon: '⭐', label: '我的收藏' }
        };
        async function initOpenCC() {
            try {
                // cn2t.js 是 opencc-js 自带的「简→繁」preset bundle，
                // 字典已经内联在 JS 里，不需要外部 s2t.json 文件（之前用 .json URL 的方式 404）。
                await new Promise((resolve, reject) => {
                    const s = document.createElement('script');
                    s.src = 'https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/cn2t.js';
                    s.async = true;
                    s.onload = resolve;
                    s.onerror = reject;
                    document.head.appendChild(s);
                });
                // 变量名 convertToSimplified 沿用旧名以保持 search 调用方不动，
                // 实际语义是「把 query 转成繁体再去搜」，因为知识库条目以繁中为主。
                const converter = window.OpenCC.Converter({ from: 'cn', to: 'tw' });
                window.convertToSimplified = converter;
                console.log('[繁简转换] 加载完成');
            } catch (e) {
                console.warn('OpenCC 加载失败，使用原始文本:', e);
                window.convertToSimplified = (text) => text;
            }
        }
        async function initSegmenter() {
            try {
                // segmentit@2.0.3 ESM bundle（package 里没有 .es.min.js，且这个 bundle 用命名导出 { Segment }）
                const { Segment } = await import('https://cdn.jsdelivr.net/npm/segmentit@2.0.3/dist/esm/segmentit.js');
                segmenter = new Segment();
                console.log('[分词] 加载完成');
            } catch (e) { console.warn('[分词] 加载失败:', e); segmenter = null; }
        }
        function tokenize(text) {
            if (!text) return [];
            if (segmenter) {
                try { return segmenter.doSegment(text, { simple: true }); }
                catch (e) { return text.split(/\s+/).filter(w => w); }
            }
            return text.split(/\s+/).filter(w => w);
        }
        function generateHotKeywords() {
            const wordCount = {};
            const fieldPattern = /^\[.+\]:$/;
            for (const record of allRecords) {
                for (const keyword of record.keywords) {
                    const words = keyword.split(/\s+/).filter(w => w);
                    for (const word of words) {
                        if (word.length < 2 || /^\d+$/.test(word) || fieldPattern.test(word) || word.startsWith('#')) continue;
                        wordCount[word] = (wordCount[word] || 0) + 1;
                    }
                }
            }
            const sorted = Object.entries(wordCount)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6)
                .map(([word]) => word);
            const tagsBar = document.getElementById('tagsBar');
            tagsBar.innerHTML = '<button class="tag-btn active" data-tag="">全部</button>' +
                sorted.map(word => `<button class="tag-btn" data-tag="${escapeHTML(word)}">${escapeHTML(word)}</button>`).join('');
            attachTagListeners();
        }
        function attachTagListeners() {
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const tag = btn.dataset.tag;
                    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                    if (tag === '') {
                        currentTag = null;
                        searchInput.value = '';
                        btn.classList.add('active');
                        showAllRecords();
                    } else if (currentTag === tag) {
                        currentTag = null;
                        btn.classList.remove('active');
                        searchInput.value = '';
                        showAllRecords();
                    } else {
                        currentTag = tag;
                        btn.classList.add('active');
                        searchInput.value = tag;
                        performSearch(tag);
                    }
                });
            });
        }
        async function loadData() {
            loadStartTime = Date.now();
            const records = []; const timestamp = Date.now();
            for (const file of FILES) {
                try {
                    const response = await fetch(`data/${file}?t=${timestamp}`);
                    if (!response.ok) throw new Error(`Failed to load ${file}`);
                    const text = await response.text();
                    const fileRecords = parseRecords(text, file);
                    records.push(...fileRecords);
                } catch (error) { console.warn(`加载 ${file} 失败:`, error); }
            }
            allRecords = records; initFuse();
            console.log(`[知识库] 加载完成，共 ${records.length} 条记录`);
            const loadTime = ((Date.now() - loadStartTime) / 1000).toFixed(2);
            document.getElementById('loadTime').textContent = `数据加载: ${loadTime}s | ${new Date().toLocaleString('zh-CN')}`;
            return records;
        }
        function parseRecords(text, sourceFile) {
            const records = []; const lines = text.split(/\r?\n/); const blocks = []; let currentBlock = '';
            for (const line of lines) {
                if (line.trim() === '---') { if (currentBlock.trim()) blocks.push(currentBlock.trim()); currentBlock = ''; }
                else { currentBlock += line + '\n'; }
            }
            if (currentBlock.trim()) blocks.push(currentBlock.trim());
            for (const block of blocks) { const record = parseBlock(block, sourceFile); if (record) records.push(record); }
            return records;
        }
        function parseBlock(block, sourceFile) {
            const blockStart = block.indexOf('[问题/关键词]:'); const blockEnd = block.indexOf('[链接]:');
            if (blockStart === -1) return null;
            const answerStart = block.indexOf('[答案]:', blockStart);
            if (answerStart === -1) return null;
            let answerContent = '', linkContent = '';
            if (blockEnd !== -1 && blockEnd > answerStart) {
                answerContent = block.substring(answerStart + '[答案]:'.length, blockEnd).trim();
                const afterLink = block.indexOf('\n', blockEnd);
                linkContent = block.substring(blockEnd + '[链接]:'.length, afterLink !== -1 ? afterLink : block.length).trim();
            } else { answerContent = block.substring(answerStart + '[答案]:'.length).trim(); }
            if (!answerContent) return null;
            const questionSection = block.substring(blockStart + '[问题/关键词]:'.length, answerStart).trim();
            const keywords = questionSection.split(/\s+/).filter(k => k);
            let tags = [];
            const tagMatch = block.match(/\[标签\]:\s*([^\n]+)/);
            if (tagMatch) { tags = tagMatch[1].trim().split(/\s+/).filter(t => t.startsWith('#')); }
            let link = linkContent.replace(/^`|`$/g, '').trim();
            if (link === '') link = '';
            // 图片字段（可选）
            let image = '';
            const imgMatch = block.match(/\[图片\]:\s*([^\n]+)/);
            if (imgMatch) { image = imgMatch[1].trim(); }
            // 来源（可选，例如某个公告/提案 ID）
            let source = '';
            const sourceMatch = block.substring(blockStart, answerStart).match(/\[来源\]:\s*([^\n]+)/);
            if (sourceMatch) { source = sourceMatch[1].trim(); }
            // 分类（基于源文件）
            const category = FILE_CATEGORIES[sourceFile] || '常见FAQ';
            // 子条目 ID（可选，显式 ID；同一个 KB 里只能用一次）
            let childId = '';
            const childIdMatch = block.substring(blockStart, answerStart).match(/\[子条目 ID\]:\s*([^\s\n]+)/);
            if (childIdMatch) { childId = childIdMatch[1].trim(); }
            // 父条目 ID（可选；子条目用它反向指回主条目）
            let parentId = '';
            const parentIdMatch = block.substring(blockStart, answerStart).match(/\[父条目 ID\]:\s*([^\s\n]+)/);
            if (parentIdMatch) { parentId = parentIdMatch[1].trim(); }
            // 主条目下面挂载的子条目 ID 清单（可选）
            let childIds = [];
            const childrenMatch = block.substring(blockStart, answerStart).match(/\[子条目\]:\s*([^\n]+)/);
            if (childrenMatch) {
                childIds = childrenMatch[1].trim().split(/[\s,，；;]+/).filter(s => s);
            }
            // 唯一 ID（用于收藏 + 子条目关联）
            // 优先级：有 [子条目 ID] 用它；有 [父条目 ID] 也用它（让父清单里的 id 能对上）；
            // 否则 fallback 到 sourceFile + keywords 的 md5，保证收藏不会因编辑答案而断联
            let id;
            if (childId) id = childId;
            else id = md5(sourceFile + '|' + keywords.join(' '));
            return { id, childId, parentId, childIds, keywords, tags, answer: answerContent, link, image, source, category, sourceFile, searchText: [...keywords, answerContent].join(' ') };
        }
        function initFuse() {
            // 用 searchText（keywords + answer 拼接）作为单一搜索字段，
            // 避免加权 keys 在某字段没匹配时把整体 score 拉爆。
            // 例：搜「静态燃烧」，keywords 里只有「燃烧」，没「静态」，
            // 旧版按 keywords:0.7 / answer:0.3 加权后 score≈0.6 > 0.35 阈值被过滤掉。
            const options = {
                keys: ['searchText'],
                includeScore: true,
                threshold: 0.35,
                distance: 100,
                minMatchCharLength: 1,
                ignoreLocation: true
            };
            fuse = new Fuse(allRecords, options);
        }
        async function performSearch(query) {
            if (!query.trim()) { showAllRecords(); return; }
            const linkSearch = query.match(/^https?:\/\/[^\s]+$/);
            if (linkSearch) {
                const result = allRecords.find(r => r.link === query);
                if (result) { await displayResults([result]); }
                else { displayEmpty('未找到该链接对应的记录', '请检查链接是否正确'); }
                return;
            }
            if (query.startsWith('#')) {
                currentTag = query;
                const tagResults = allRecords.filter(r => r.tags.some(t => t.toLowerCase().includes(currentTag.toLowerCase())));
                await displayResults(tagResults, query); return;

                const stored = localStorage.getItem('ark-kb-favorites');
                if (stored) favorites = new Set(JSON.parse(stored));
            } catch (e) { favorites = new Set(); }
        }
        function saveFavorites() {
            try {
                localStorage.setItem('ark-kb-favorites', JSON.stringify([...favorites]));
            } catch (e) {}
        }
        function toggleFavorite(id) {
            if (favorites.has(id)) {
                favorites.delete(id);
                showToast('已取消收藏');
            } else {
                favorites.add(id);
                showToast('已加入收藏 ⭐', true);
            }
            saveFavorites();
            // 重新渲染侧边栏和结果（如果当前在收藏页）
            renderSidebar();
            if (currentCategory === 'favorites') refreshResults();
        }
        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebarBackdrop').classList.add('show');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebarBackdrop').classList.remove('show');
        }
        function openImageModal(src) {
            let modal = document.getElementById('imageModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'imageModal';
                modal.className = 'image-modal';
                modal.innerHTML = '<img alt="预览" />';
                modal.addEventListener('click', () => modal.classList.remove('show'));
                document.body.appendChild(modal);
            }
            modal.querySelector('img').src = src;
            modal.classList.add('show');
        }
        function displayEmpty(title, hint) {
            const container = document.getElementById('resultsContainer');
            const statsBar = document.getElementById('statsBar');
            statsBar.style.display = 'none';
            container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">${title}</div><div class="empty-hint">${hint}</div></div>`;
        }
        function showToast(message, success = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast' + (success ? ' success' : '');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }
        function cyclePlaceholder() {
            if (!searchInput.value && placeholderIndex !== undefined) { searchInput.placeholder = PLACEHOLDERS[placeholderIndex % PLACEHOLDERS.length]; placeholderIndex++; }
        }
        let debounceTimer;
        function debounceSearch() { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { performSearch(searchInput.value); }, 300); }
        // ============ AI 客服助手 (Chat) ============
        // Cloudflare Worker → 智谱 GLM-4.7-Flash（全量 KB 灌入 system prompt）
        // 客服在 chat 中提问 → 带历史对话发 Worker → LLM 基于 KB 全文回答
        const CHAT_WORKER_URL = 'https://white-recipe-de08ark-kb-search.btcwilliamxx.workers.dev';
        const CHAT_HISTORY_KEY = 'ark_chat_history_v1';
        const CHAT_MAX_HISTORY = 6;   // 保留最近 6 轮（user + assistant 各 1 算 1 轮）

        async function startApp() {
            searchInput = document.getElementById('searchInput');
            await initOpenCC();
            await initSegmenter();
            await loadData();
            loadFavorites();
            renderSidebar();
            generateHotKeywords();
            searchInput.addEventListener('input', debounceSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { searchInput.value = ''; currentTag = null; setCategory('all'); }
                if (e.key === 'Enter') { clearTimeout(debounceTimer); performSearch(searchInput.value); }
            });
            initChat();
            document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); } });
            // 侧边栏：移动端汉堡菜单
            document.getElementById('sidebarHandle').addEventListener('click', openSidebar);
            document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
            document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);
            setInterval(cyclePlaceholder, 3000); cyclePlaceholder();
            refreshResults();
            document.getElementById('versionTimestamp').textContent = `数据版本: ${new Date().toLocaleString('zh-CN')}`;
        }
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }

        // ============ AI 客服助手 (Chat) ============
        // Cloudflare Worker → 智谱 GLM-4.7-Flash
        // 思路：Worker 一次性 fetch 完整 KB（8 个 txt）放进 system prompt，
        //       前端带历史对话（最多 6 轮）发请求，LLM 基于 KB 全文回答。
        //       前端自己用 allRecords 做 substring 命中，给每条 AI 答案挂"📚 相关话术"折叠面板。
        let chatBody, chatInput, chatSendBtn, chatClearBtn, chatStatsEl;
        let chatHistory = [];          // [{role: 'user'|'assistant', content, refs?, ts}]
        let chatSending = false;

        function initChat() {
            chatBody = document.getElementById('chatBody');
            chatInput = document.getElementById('chatInput');
            chatSendBtn = document.getElementById('chatSendBtn');
            chatClearBtn = document.getElementById('chatClearBtn');
            chatStatsEl = document.getElementById('chatStats');

            loadChatHistory();
            renderChat();

            // 自动撑高 textarea
            chatInput.addEventListener('input', autoGrowChatInput);
            // Enter 发送 / Shift+Enter 换行
            chatInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    doSendChat();
                }
            });
            chatSendBtn.addEventListener('click', doSendChat);
            chatClearBtn.addEventListener('click', clearChat);
            // 事件代理：复制按钮
            chatBody.addEventListener('click', onChatBodyClick);

            // 历史恢复时为旧 assistant 消息重算 refs（localStorage 只存 role/content/ts）
            chatHistory.forEach(m => {
                if (m.role === 'assistant' && !m.refs && m.content) {
                    // 找到它前面最近一条 user 消息作为命中 query
                    const idx = chatHistory.indexOf(m);
                    let q = '';
                    for (let i = idx - 1; i >= 0; i--) {
                        if (chatHistory[i].role === 'user') { q = chatHistory[i].content; break; }
                    }
                    m.refs = q ? findRelatedKB(q, 4) : [];
                }
            });
            if (chatHistory.some(m => m.role === 'assistant' && !m.refs && m.content)) {
                saveChatHistory();   // 存一份带 refs 的，下次启动不用再算
            }

            updateChatStats();
        }

        function onChatBodyClick(e) {
            const btn = e.target.closest('.chat-msg-action');
            if (!btn) return;
            const idx = parseInt(btn.dataset.idx, 10);
            const msg = chatHistory[idx];
            if (!msg) return;
            const text = msg.content || '';
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); showToast('已复制到剪贴板'); } catch (_) {}
            document.body.removeChild(ta);
        }

        function autoGrowChatInput() {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
        }

        function loadChatHistory() {
            try {
                const raw = localStorage.getItem(CHAT_HISTORY_KEY);
                chatHistory = raw ? JSON.parse(raw) : [];
                // 数据迁移：旧版可能是 [{q, a}] 形，这里只接受带 role 字段的
                if (!Array.isArray(chatHistory)) chatHistory = [];
                chatHistory = chatHistory.filter(m => m && (m.role === 'user' || m.role === 'assistant'));
            } catch (e) { chatHistory = []; }
        }

        function saveChatHistory() {
            try {
                // 只持久化 role + content，refs 每次重新算
                const slim = chatHistory.map(m => ({ role: m.role, content: m.content, ts: m.ts }));
                localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(slim));
            } catch (e) { /* quota exceeded 等 */ }
        }

        function clearChat() {
            if (chatHistory.length === 0) return;
            if (!confirm('确定要清空所有对话历史吗？此操作不可撤销。')) return;
            chatHistory = [];
            saveChatHistory();
            renderChat();
            updateChatStats();
        }

        function updateChatStats() {
            const turns = chatHistory.filter(m => m.role === 'user').length;
            chatStatsEl.textContent = `${turns} 轮`;
            chatStatsEl.title = `对话历史：${turns} 轮 / 限 ${CHAT_MAX_HISTORY} 轮`;
        }

        function truncateHistory() {
            // CHAT_MAX_HISTORY 是按 user 轮算；保留最近 N * 2 条消息
            const maxMsgs = CHAT_MAX_HISTORY * 2;
            if (chatHistory.length > maxMsgs) {
                chatHistory = chatHistory.slice(chatHistory.length - maxMsgs);
            }
        }

        // 用本地 KB 找前 N 条最相关的（substring 优先 + Fuse 兜底）→ 给 AI 答案挂"📚 相关话术"
        function findRelatedKB(query, n) {
            n = n || 4;
            const simplifiedQuery = window.convertToSimplified ? window.convertToSimplified(query) : query;
            const variants = [...new Set([query, simplifiedQuery])];
            const foundIds = new Set();
            const hits = [];
            // Pass 1: substring 精确
            for (const v of variants) {
                const needle = v.toLowerCase();
                for (const rec of allRecords) {
                    if (foundIds.has(rec.id)) continue;
                    if (rec.searchText && rec.searchText.toLowerCase().includes(needle)) {
                        hits.push(rec);
                        foundIds.add(rec.id);
                        if (hits.length >= n) return hits;
                    }
                }
            }
            // Pass 2: Fuse 模糊（用主 fuse，不新建）
            if (fuse && hits.length < n) {
                for (const v of variants) {
                    const tokens = tokenize(v).filter(t => t.length >= 2);
                    const queries = tokens.length > 1 ? tokens : [v];
                    for (const q of queries) {
                        fuse.search(q).forEach(r => {
                            if (foundIds.has(r.item.id)) return;
                            hits.push(r.item);
                            foundIds.add(r.item.id);
                        });
                        if (hits.length >= n) break;
                    }
                    if (hits.length >= n) break;
                }
            }
            return hits.slice(0, n);
        }

        function renderChat() {
            if (chatHistory.length === 0) {
                chatBody.innerHTML = '<div class="chat-empty">还没有对话 · 输入问题试试，比如「015 号提案阶级奖池比例怎么算的？」</div>';
                return;
            }
            const html = chatHistory.map((m, idx) => renderChatMessage(m, idx)).join('');
            chatBody.innerHTML = html;
            // 滚动到底部
            chatBody.scrollTop = chatBody.scrollHeight;
        }

        function renderChatMessage(m, idx) {
            const ts = m.ts ? new Date(m.ts).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
            const role = m.role;
            const label = role === 'user' ? '你' : 'AI 助手';
            let refsHtml = '';
            if (role === 'assistant' && m.refs && m.refs.length > 0) {
                refsHtml = `<details class="chat-msg-refs">
                    <summary>📚 相关话术（${m.refs.length} 条）</summary>
                    ${m.refs.map(r => `<div class="chat-msg-ref-item">
                        <div class="chat-msg-ref-title">${escapeHTML((r.keywords || []).slice(0, 6).join(' '))}</div>
                        <div>${escapeHTML(r.answer.length > 280 ? r.answer.slice(0, 280) + '...' : r.answer)}</div>
                    </div>`).join('')}
                </details>`;
            }
            const warn = role === 'assistant'
                ? `<div class="chat-msg-warn">⚠️ 内容由 AI 生成，仅供参考。客服使用前请人工核对关键数字 / 地址。</div>`
                : '';
            const copyBtn = role === 'assistant'
                ? `<button class="chat-msg-action" data-idx="${idx}" data-action="copy">📋 复制</button>`
                : '';
            return `<div class="chat-msg ${role}">
                <div class="chat-msg-role">${label} · ${escapeHTML(ts)}</div>
                <div class="chat-msg-bubble">${escapeHTML(m.content).replace(/\n/g, '<br>')}</div>
                ${warn}
                ${refsHtml}
                <div class="chat-msg-meta">
                    <div class="chat-msg-actions">${copyBtn}</div>
                </div>
            </div>`;
        }

        function showToast(text) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 1500);
        }

        function setChatStatus(html) {
            document.getElementById('chatStatus').innerHTML = html;
        }

        async function doSendChat() {
            const text = chatInput.value.trim();
            if (!text || chatSending) return;

            chatSending = true;
            chatSendBtn.disabled = true;
            chatInput.value = '';
            chatInput.style.height = 'auto';

            // 1) 先把 user 消息落进历史 + 渲染
            const userMsg = { role: 'user', content: text, ts: Date.now() };
            chatHistory.push(userMsg);
            truncateHistory();
            renderChat();
            updateChatStats();

            // 2) 准备发给 Worker 的 messages（不存 refs）
            const apiMessages = chatHistory.map(m => ({ role: m.role, content: m.content }));

            // 3) 临时占位 + loading dots
            const loadingIdx = chatHistory.length;
            chatHistory.push({ role: 'assistant', content: '', ts: Date.now(), refs: [], loading: true });
            renderChat();

            setChatStatus('<span class="chat-loading-dot"></span><span class="chat-loading-dot"></span><span class="chat-loading-dot"></span> AI 思考中...（首次冷启动约 2-3 秒）');

            try {
                const resp = await fetch(CHAT_WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: apiMessages,
                        // 旧字段兼容（保留），新 Worker 会忽略
                        question: text,
                        contexts: []
                    })
                });

                if (!resp.ok) {
                    const errText = await resp.text();
                    throw new Error(`Worker ${resp.status}: ${errText.slice(0, 200)}`);
                }
                const data = await resp.json();
                const answer = (data.answer || '（模型无回复）').trim();

                // 4) 用最后一条 user 消息找相关 KB，挂 refs
                const refs = findRelatedKB(text, 4);
                chatHistory[loadingIdx] = { role: 'assistant', content: answer, ts: Date.now(), refs };
                renderChat();
                saveChatHistory();
                updateChatStats();
                setChatStatus('');
            } catch (e) {
                chatHistory[loadingIdx] = {
                    role: 'assistant',
                    content: `⚠️ AI 调用失败：${e.message}\n\n检查：\n1. Worker URL 是否可达\n2. 网络是否通畅\n3. KB 是否已部署到 GitHub Pages`,
                    ts: Date.now(),
                    refs: []
                };
                renderChat();
                saveChatHistory();   // 即使失败也要存历史，不然后面刷新看不到失败原因
                setChatStatus('');
            } finally {
                chatSending = false;
                chatSendBtn.disabled = false;
                chatInput.focus();
            }
        }

        // ============ 入口：根据密码决定是否启动主程序 ============
        if (isAuthed()) {
            document.getElementById('loginOverlay').classList.add('hidden');
            startApp();
        } else {
            bindLogin();
        }
    </script>
    <button class="back-to-top" id="backToTop" title="回到顶部" aria-label="回到顶部">↑</button>
    <script>
        // IIFE 必须等 DOM 解析完才跑 → 单独 script 块, 浏览器自动延迟到 </body> 前执行
        (function() {
            const btn = document.getElementById('backToTop');
            if (!btn) { console.warn('[back-to-top] button not found'); return; }
            const SHOW_AT = 400;
            let ticking = false;
            const onScroll = () => {
                if (!ticking) {
                    requestAnimationFrame(() => {
                        btn.classList.toggle('show', window.scrollY > SHOW_AT);
                        ticking = false;
                    });
                    ticking = true;
                }
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            onScroll();
            console.log('[back-to-top] initialized, scrollY=' + window.scrollY);
        })();
    </script>
</body>
